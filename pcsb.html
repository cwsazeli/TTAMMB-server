<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TTAMM Package B — Client Portal</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#F4F6F9;--panel:#fff;--panel2:#F7F9FB;--text:#0F1B2A;--dim:#445366;--faint:#7A8797;--border:#DCE2EA;--soft:#EBEFF4;
  --accent:#C9650A;--ok:#1E8A55;--info:#2A6FB8;--warn:#9A7300;--bad:#C6412F;--hover:#F1F4F8;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1420;--panel:#111D2C;--panel2:#16243536;--text:#E8EEF5;--dim:#B3C0CF;--faint:#8494A7;--border:#24354A;--soft:#1B2A3D;
  --accent:#E8862C;--ok:#4CAF7D;--info:#4A90D9;--warn:#E8C547;--bad:#E2604F;--hover:#16263A;}}
:root[data-theme="dark"]{--bg:#0B1420;--panel:#111D2C;--panel2:#162435;--text:#E8EEF5;--dim:#B3C0CF;--faint:#8494A7;--border:#24354A;--soft:#1B2A3D;
  --accent:#E8862C;--ok:#4CAF7D;--info:#4A90D9;--warn:#E8C547;--bad:#E2604F;--hover:#16263A;}
*{box-sizing:border-box;} html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
button{font:inherit;cursor:pointer;} a{color:var(--info);}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5;}
header img{height:38px;} header h1{font-size:17px;margin:0;} header .sub{font-size:12px;color:var(--faint);}
header .sp{flex:1;} .hb{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:4px;padding:6px 11px;font-size:12.5px;font-weight:600;}
nav{display:flex;gap:2px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--border);padding:0 14px;position:sticky;top:63px;z-index:4;}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 13px;font-weight:700;color:var(--dim);white-space:nowrap;}
nav button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);}
main{max-width:1280px;margin:0 auto;padding:20px 16px 50px;}
h2{font-size:21px;margin:0 0 4px;} .lead{color:var(--dim);margin:0 0 16px;max-width:80ch;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px;}
.tile{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:4px;padding:10px 12px;text-align:left;color:var(--text);}
.tile b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums;} .tile span{font-size:12.5px;font-weight:600;} .tile em{display:block;font-style:normal;font-size:11px;color:var(--faint);}
.tile.ok{border-left-color:var(--ok);} .tile.ok b{color:var(--ok);} .tile.bad{border-left-color:var(--bad);} .tile.bad b{color:var(--bad);} .tile.warn{border-left-color:var(--warn);} .tile.warn b{color:var(--warn);}
.tile.info{border-left-color:var(--info);} .tile.info b{color:var(--info);} .tile.acc{border-left-color:var(--accent);} .tile.acc b{color:var(--accent);} button.tile.on{box-shadow:inset 0 0 0 2px var(--accent);}
.box{background:var(--panel);border:1px solid var(--border);border-radius:4px;margin-bottom:16px;overflow:hidden;}
.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--soft);} .bh h3{margin:0;font-size:15px;}
.tw{overflow-x:auto;} table{width:100%;border-collapse:collapse;font-size:13px;} th{font-size:11.5px;color:var(--faint);text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--panel);}
td{padding:9px 12px;border-bottom:1px solid var(--soft);vertical-align:top;} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;} tr:last-child td{border-bottom:0;}
tr.x{cursor:pointer;} tr.x:hover td{background:var(--hover);} tr.det td{background:var(--panel2);}
.chips{display:flex;gap:5px;flex-wrap:wrap;} .chip{border:1px solid var(--border);background:none;color:var(--dim);border-radius:999px;padding:4px 11px;font-size:12px;}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text);}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:3px;border:1px solid currentColor;white-space:nowrap;}
.ok{color:var(--ok);} .bad{color:var(--bad);} .warn{color:var(--warn);} .info{color:var(--info);} .acc{color:var(--accent);} .faint{color:var(--faint);}
.stg{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 5px;margin-right:3px;border-radius:3px;border:1px solid var(--border);color:var(--faint);} .stg.y{background:var(--ok);border-color:var(--ok);color:#fff;}
.bar{display:inline-block;width:70px;height:6px;background:var(--soft);border-radius:2px;vertical-align:middle;margin-right:6px;overflow:hidden;} .bar span{display:block;height:100%;background:var(--info);}
.ocb{display:grid;grid-template-columns:minmax(150px,280px) 1fr 40px;gap:10px;align-items:center;padding:4px 16px;background:none;border:0;width:100%;text-align:left;color:var(--text);}
.ocb:hover,.ocb.on{background:var(--panel2);} .ocb .t{height:10px;background:var(--soft);border-radius:2px;overflow:hidden;} .ocb .t i{display:block;height:100%;}
input.q{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:4px;padding:6px 10px;font:inherit;min-width:220px;}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:14px 16px;} .ph a{display:block;border:1px solid var(--border);border-radius:4px;padding:10px;text-decoration:none;color:var(--text);background:var(--panel2);}
.ph a b{display:block;font-size:12.5px;word-break:break-word;} .ph a span{font-size:11.5px;color:var(--faint);}
.msg{max-width:560px;margin:60px auto;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:26px;text-align:center;}
.foot{color:var(--faint);font-size:12px;margin-top:20px;}
@media (max-width:700px){header{padding:10px 12px;} nav{top:auto;position:static;} main{padding:14px 12px 40px;} .ocb{grid-template-columns:1fr 70px 34px;} input.q{min-width:0;width:100%;}}
@media print{header .hb,nav{display:none!important;} body{background:#fff;} .box{break-inside:avoid;}}
</style>
</head>

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const fdt = s => { const d = new Date(s); return isNaN(d) ? '—' : `${String(d.getDate()).padStart(2, '0')} ${MON[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const isOpen = f => /^OPEN/i.test(f.status) && !f.transferred, isOver = f => isOpen(f) && /OVERDUE/i.test(f.status), isClosed = f => /^CLOSED/i.test(f.status);

    if(j.error){ $('#main').innerHTML = `<div class="msg"><h2>Cannot open the portal</h2><p class="lead" style="margin:10px auto">${esc(j.error)}</p></div>`; $('#pub').textContent = ''; return; }

}
function tabs(){

    const ch = (k, v, l) => `<button class="chip" data-f="${k}" data-v="${v}" aria-pressed="${F[k] === v}">${l}</button>`;
    h += `<h2>AIF Findings</h2><p class="lead">Click a finding to see details, material ETA and photos.</p>
      <div class="box"><div class="bh"><div class="chips">${ch('st', 'open', 'Open ' + A.filter(isOpen).length)}${ch('st', 'overdue', 'Overdue ' + A.filter(isOver).length)}${ch('st', 'closed', 'Closed ' + A.filter(isClosed).length)}${ch('st', 'tr', 'Transferred ' + A.filter(f => f.transferred).length)}${ch('st', 'all', 'All ' + A.length)}</div>
        <div class="chips">${ch('p', 'all', 'All P')}${['1', '2', '3', '4'].map(p => ch('p', p, 'P' + p)).join('')}</div><div class="chips">${ch('a', 'all', 'All areas')}${areas.map(a => ch('a', a, esc(a))).join('')}</div><input class="q" id="q" placeholder="Search notification, equipment, finding…" value="${esc(F.q)}"></div>
      <div class="tw"><table><thead>${head([])}</thead><tbody>${findingRows(L, [])}</tbody></table></div>${!L.length ? '<p class="lead" style="padding:14px 16px;margin:0">No finding matches.</p>' : ''}<div class="foot" style="padding:0 16px 12px">${L.length} shown</div></div>`;
  } else if(TAB === 'rdy'){
    const nd = A.filter(f => isOpen(f) && !f.st.exe), K = [['go', ['ready', 'eta_ok', 'none'], 'Ready to execute', 'ok'], ['waiting', ['waiting'], 'Waiting delivery', 'info'], ['surplus', ['surplus'], 'Material being arranged', 'acc'], ['blocked', ['blocked', 'eta_no'], 'Material not ready', 'bad'], ['unknown', ['unknown', null], 'Not assessed yet', '']];
    const L = nd.filter(f => RDF === 'all' || K.find(k => k[0] === RDF)[1].includes(f.rd)).sort((a, b) => pri(a.priority) - pri(b.priority) || (dayN(a.due) ?? 1e9) - (dayN(b.due) ?? 1e9));
    h += `<h2>Work Readiness</h2><p class="lead">Open findings not yet executed, and whether their material is ready (checked against the survey material take-off and deliveries).</p>
      <div class="tiles">${K.map(([k, ks, l, c]) => `<button class="tile ${c}${RDF === k ? ' on' : ''}" data-r="${k}"><b>${nd.filter(f => ks.includes(f.rd)).length}</b><span>${l}</span></button>`).join('')}<button class="tile${RDF === 'all' ? ' on' : ''}" data-r="all"><b>${nd.length}</b><span>All not executed</span></button></div>
      <div class="box"><div class="tw"><table><thead>${head([])}</thead><tbody>${findingRows(L, [])}</tbody></table></div></div>`;
  } else if(TAB === 'od'){
    const od = A.filter(f => isOver(f) && f.cause), keys = Object.keys(OCL()).filter(k => od.some(f => f.cause === k)), max = Math.max(1, ...keys.map(k => od.filter(f => f.cause === k).length));
    const col = c => ({ok: 'var(--ok)', bad: 'var(--bad)', warn: 'var(--warn)', info: 'var(--info)', acc: 'var(--accent)'})[c] || 'var(--faint)';
    const L = od.filter(f => OCF === 'all' || f.cause === OCF).sort((a, b) => keys.indexOf(a.cause) - keys.indexOf(b.cause) || pri(a.priority) - pri(b.priority));
    h += `<h2>Overdue Analysis</h2><p class="lead">${od.length} open finding${od.length === 1 ? ' is' : 's are'} past the due date. Each is grouped by what is holding it, with the action ZNESB is taking.</p>
      <div class="box" style="padding:10px 0">${keys.map(k => { const n = od.filter(f => f.cause === k).length, l = OCL()[k]; return `<button class="ocb${OCF === k ? ' on' : ''}" data-o="${k}" title="${esc(l[2] || '')}"><span>${esc(l[0])}</span><span class="t"><i style="width:${n / max * 100}%;background:${col(l[1])}"></i></span><b style="text-align:right">${n}</b></button>`; }).join('')}<button class="ocb${OCF === 'all' ? ' on' : ''}" data-o="all"><b>All overdue</b><span></span><b style="text-align:right">${od.length}</b></button></div>
      <div class="box"><div class="tw"><table><thead>${head(['cause'])}</thead><tbody>${findingRows(L, ['cause'])}</tbody></table></div></div>`;
  } else if(TAB === 'wop'){
    const W = (D.wops || []).slice().sort((a, b) => String(a.no).localeCompare(String(b.no), undefined, {numeric: true}));
    const col = s => /COMPLETED/i.test(s) ? 'var(--ok)' : /ONGOING/i.test(s) ? 'var(--info)' : /HOLD/i.test(s) ? 'var(--bad)' : 'var(--faint)';
    h += `<h2>WOP Progress</h2><p class="lead">Work orders under Package B — status, progress and schedule.</p>
      <div class="tiles"><div class="tile"><b>${W.length}</b><span>WOP</span></div><div class="tile ok"><b>${W.filter(w => /COMPLETED/i.test(w.status)).length}</b><span>Completed</span></div><div class="tile info"><b>${W.filter(w => /ONGOING/i.test(w.status)).length}</b><span>Ongoing</span></div><div class="tile"><b>${W.filter(w => /YET/i.test(w.status)).length}</b><span>Yet to start</span></div></div>
      <div class="box"><div class="tw"><table><thead><tr><th>WOP No.</th><th>Title</th><th>Location</th><th>Status</th><th>Progress</th><th>Start</th><th>Finish</th></tr></thead><tbody>
      ${W.map(w => `<tr><td style="white-space:nowrap;font-family:ui-monospace,monospace;font-size:12.5px">${esc(w.no || '—')}</td><td style="min-width:240px">${esc(w.title)}</td><td>${esc(w.loc || '—')}</td><td style="white-space:nowrap;font-weight:700;color:${col(w.status)}">${esc(w.status || '—')}</td>
        <td style="white-space:nowrap"><span class="bar"><span style="width:${Math.max(0, Math.min(100, w.pg))}%;background:${col(w.status)}"></span></span>${w.pg}%</td><td style="white-space:nowrap">${fd(w.start)}</td><td style="white-space:nowrap${/COMPLETED/i.test(w.status) || dayN(w.finish) === null || dayN(w.finish) >= today() ? '' : ';color:var(--bad);font-weight:600'}">${fd(w.finish)}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  } else {
    const P = D.photos || [], byKey = {}; P.forEach(p => (byKey[p.key] = byKey[p.key] || []).push(p));
    const lbl = k => { if(/^aif:/.test(k)){ const f = A.find(x => 'aif:' + x.uid === k); return f ? `${f.notif || f.report} — ${f.finding.slice(0, 80)}` : k; } return (byKey[k][0] && byKey[k][0].label) || k; };
    h += `<h2>Photos &amp; Files</h2><p class="lead">Evidence attached to findings and WOPs.</p>${!P.length ? '<div class="box"><p class="lead" style="padding:16px;margin:0">No photos or files published yet.</p></div>' : Object.keys(byKey).map(k => `<div class="box"><div class="bh"><h3>${esc(lbl(k))}</h3><span class="faint">${byKey[k].length} file${byKey[k].length === 1 ? '' : 's'}</span></div><div class="ph">${byKey[k].map(p => `<a href="${esc(p.url)}" target="_blank" rel="noopener"><b>${/^image\//.test(p.mime) ? '🖼' : /pdf/.test(p.mime) ? '📕' : '📄'} ${esc(p.name)}</b><span>${fdt(p.at)}</span></a>`).join('')}</div></div>`).join('')}`;
  }
  h += `<div class="foot">Published by Zulkifli Ngah Engineering Sdn Bhd (ZNESB) for PETRONAS Carigali — TTAMM Package B. Figures reflect the status at the publishing time shown at the top.</div>`;
  el.innerHTML = h;
  el.querySelectorAll('tr.x').forEach(tr => tr.onclick = () => { const u = tr.dataset.u; OPEN.has(u) ? OPEN.delete(u) : OPEN.add(u); render(); });
  el.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { F[b.dataset.f] = b.dataset.v; render(); });
  el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { RDF = b.dataset.r; render(); });
  el.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { OCF = b.dataset.o; render(); });
  const q = $('#q'); if(q) q.oninput = () => { F.q = q.value; const p = q.selectionStart; render(); const q2 = $('#q'); q2.focus(); try{ q2.setSelectionRange(p, p); }catch(e){} };
}
$('#bPrint').onclick = () => window.print();
$('#bReload').onclick = load;
$('#bTheme').onclick = () => { const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nx); try{ localStorage.setItem('ttamm_pcsb_theme', nx); }catch(e){} };
load();
</script>
</body>
</html>
